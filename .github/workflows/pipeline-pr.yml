name: PR Pipeline

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      skip-lint: ${{ github.actor == 'dependabot[bot]' }}
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
