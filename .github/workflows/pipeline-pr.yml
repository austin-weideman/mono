name: PR Pipeline

on:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Skip CI for Renovate-opened PRs. Each Renovate rebase onto dev re-triggers
    # this workflow, and with 30+ open Renovate PRs that burns GitHub Actions
    # minutes. Renovate version bumps are pre-validated by minimumReleaseAge +
    # the package authors' own CI; we run our checks on dev after merge.
    if: github.event.pull_request.user.login != 'renovate[bot]'
    name: Checks
    uses: ./.github/workflows/checks.yml
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
